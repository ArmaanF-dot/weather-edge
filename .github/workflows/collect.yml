name: collect
on:
  schedule: [{ cron: "7 * * * *" }]   # hourly; read-only public data
  workflow_dispatch:
permissions: { contents: write }
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Restore data branch
        run: |
          git fetch origin data:data 2>/dev/null && git checkout data -- snapshots 2>/dev/null || echo "no data branch yet"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -W ignore ingest/collect.py
      - name: Commit to data branch
        run: |
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git checkout --orphan data-new; git reset -q; git add -f snapshots
          git commit -qm "snapshot $(date -u +%FT%H:%MZ)" || exit 0
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then git fetch -q origin data && git checkout -q data && git checkout -q data-new -- snapshots && git commit -qam "snapshot $(date -u +%FT%H:%MZ)" || true; git push -q origin data; else git branch -M data; git push -q origin data; fi
