name: gate3
on: workflow_dispatch
jobs:
  gate3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Gate 3 Chicago
        run: python -W ignore eval/gate3_model_vs_market.py chicago 2400 2>&1 | tee data/gate3_chicago.txt
        continue-on-error: true
      - name: Gate 3 NYC
        run: python -W ignore eval/gate3_model_vs_market.py nyc 2400 2>&1 | tee data/gate3_nyc.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gate3-results, path: data/ }
